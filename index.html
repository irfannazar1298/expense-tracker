<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-4">Expense Tracker</h1>

    <form id="expenseForm" class="row g-2 mb-4">
      <div class="col-md-3">
        <input id="name" class="form-control" placeholder="Expense name" required>
      </div>
      <div class="col-md-2">
        <input id="amount" class="form-control" type="number" min="0.01" step="0.01" placeholder="Amount" required>
      </div>
      <div class="col-md-2">
        <select id="category" class="form-select" required>
          <option value="">Category</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Shopping</option>
          <option>Other</option>
        </select>
      </div>
      <div class="col-md-3">
        <input id="date" class="form-control" type="date" required>
      </div>
      <div class="col-md-2">
        <button id="submitButton" class="btn btn-primary w-100" type="submit">Add Expense</button>
      </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <h2 class="h4">Expenses</h2>
      <select id="filter" class="form-select w-auto">
        <option value="">All Categories</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Bills</option>
        <option>Shopping</option>
        <option>Other</option>
      </select>
    </div>

    <p>Total: <strong id="total">₹0.00</strong></p>
    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expenseList"></tbody>
      </table>
    </div>
  </div>
  <script src="exam1.js"></script>
</body>
</html>
